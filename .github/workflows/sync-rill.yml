name: Sync qualified Rill Runtime

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [rill-runtime-qualified]

permissions:
  contents: read

concurrency:
  group: qualified-rill-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: hello-yunshu/rill-openwrt-packages
          ref: main
          path: rill-openwrt-packages
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Resolve latest qualified Stable 1.x
        run: python3 scripts/check_rill_dependency.py --sync --package-dir rill-openwrt-packages
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Open update pull request
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rill-pr.md" <<'EOF'
          Updates the immutable dependency contract only after package qualification.
          Migration evidence and compatible extension fields must remain intact.
          Required consumer CI must run on this exact candidate before merge;
          Consumer CI is explicitly dispatched for this candidate; PR creation is not qualification.
          EOF
          python3 rill-openwrt-packages/scripts/open_sync_pr.py --base main --prefix automation/rill-qualified \
            --title "deps(rill): sync qualified Runtime contract" --qualification-workflow ci.yml \
            --body-file "$RUNNER_TEMP/rill-pr.md" contracts/rill-runtime.json
        env:
          GH_TOKEN: ${{ github.token }}
