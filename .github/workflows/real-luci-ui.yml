name: Real LuCI UI Gate

on:
  pull_request:
    paths:
      - 'package/luci-app-cloudflare-ip/htdocs/**'
      - 'package/luci-app-cloudflare-ip/root/usr/share/luci/**'
      - 'package/luci-app-cloudflare-ip/root/usr/libexec/rpcd/**'
      - 'package/luci-app-cloudflare-ip/root/etc/config/**'
      - 'tests/real-luci-ui*'
      - '.github/workflows/real-luci-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-luci-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start a real OpenWrt + LuCI container
        run: |
          set -euo pipefail
          docker run -d --name cfip-ui-gate --network host \
            openwrt/rootfs:x86_64-24.10.8 /sbin/init
          tries=0
          until docker exec cfip-ui-gate true 2>/dev/null; do
            tries=$((tries + 1))
            if [ "$tries" -ge 30 ]; then
              echo 'OpenWrt container did not start' >&2
              exit 1
            fi
            sleep 2
          done
      - name: Install real runtime tools inside OpenWrt
        run: |
          set -euo pipefail
          docker exec cfip-ui-gate sh -c '
            opkg update
            opkg install bash jq curl tar luci-base luci-theme-bootstrap uhttpd rpcd
            for command in bash jq curl; do command -v "$command" >/dev/null; done
          '
      - name: Provision the current working tree into real LuCI
        run: CFIP_UI_LANG=en bash tests/real-luci-ui-provision.sh cfip-ui-gate 18080
      - name: Install Playwright bindings and use runner Chrome
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ui" --no-audit --no-fund playwright@1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo 'No Chrome executable on runner; browser setup required' >&2
            exit 1
          fi
          echo "PLAYWRIGHT_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Run real LuCI interaction assertions
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/ui/node_modules" \
            node tests/real-luci-ui.cjs \
            --evidence "$GITHUB_WORKSPACE/real-luci-ui-evidence"
      - name: Install checksum-pinned Aurora theme in OpenWrt
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/luci-theme-aurora.ipk" \
            https://github.com/eamonxg/luci-theme-aurora/releases/download/v1.4.0/luci-theme-aurora_1.4.0-r20260920_all.ipk
          echo "5b3f2d669ef82e575498d1b99c4b9b498088540eeff7db989f214b63d3ef8a8e  $RUNNER_TEMP/luci-theme-aurora.ipk" | sha256sum -c -
          docker cp "$RUNNER_TEMP/luci-theme-aurora.ipk" cfip-ui-gate:/tmp/luci-theme-aurora.ipk
          docker exec cfip-ui-gate opkg install /tmp/luci-theme-aurora.ipk
      - name: Capture all-page real theme and viewport visual matrix
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/ui/node_modules" \
            CFIP_VISUAL_OUT="$GITHUB_WORKSPACE/real-luci-ui-evidence/visual" \
            node tests/real-luci-ui-visual.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: real-luci-ui-evidence-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: real-luci-ui-evidence/
          if-no-files-found: warn
      - name: Remove the disposable container
        if: always()
        run: docker rm -f cfip-ui-gate || true
