name: Real LuCI UI Gate

on:
  pull_request:
    paths:
      - 'package/luci-app-cloudflare-ip/htdocs/**'
      - 'package/luci-app-cloudflare-ip/root/usr/share/luci/**'
      - 'package/luci-app-cloudflare-ip/root/usr/libexec/rpcd/**'
      - 'package/luci-app-cloudflare-ip/root/etc/config/**'
      - 'tests/real-luci-ui*'
      - '.github/workflows/real-luci-ui.yml'
  workflow_dispatch:
    inputs:
      language:
        description: LuCI language to use for the full visual matrix
        required: true
        type: choice
        options:
          - en
          - zh_cn
        default: en

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-luci-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start a real OpenWrt + LuCI container
        run: |
          set -euo pipefail
          docker run -d --name cfip-ui-gate --network host \
            openwrt/rootfs:x86_64-24.10.8 /sbin/init
          tries=0
          until docker exec cfip-ui-gate true 2>/dev/null; do
            tries=$((tries + 1))
            if [ "$tries" -ge 30 ]; then
              echo 'OpenWrt container did not start' >&2
              exit 1
            fi
            sleep 2
          done
      - name: Install real runtime tools inside OpenWrt
        run: |
          set -euo pipefail
          docker exec cfip-ui-gate sh -c '
            opkg update
            opkg install bash jq curl tar luci-base luci-theme-bootstrap uhttpd rpcd
            for command in bash jq curl; do command -v "$command" >/dev/null; done
          '
      - name: Compile the real Simplified Chinese LuCI catalog
        if: ${{ inputs.language == 'zh_cn' }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/luci-po2lmo"
          mkdir -p "$source_dir"
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/luci-openwrt-24.10.tar.gz" \
            https://codeload.github.com/openwrt/luci/tar.gz/aa4865e8e6472d6ba68e541688065fc2235bbd83
          tar -xzf "$RUNNER_TEMP/luci-openwrt-24.10.tar.gz" \
            -C "$source_dir" --strip-components=1
          make -C "$source_dir/modules/luci-base/src" po2lmo
          "$source_dir/modules/luci-base/src/po2lmo" \
            "$GITHUB_WORKSPACE/package/luci-app-cloudflare-ip/po/zh_Hans/cloudflare-ip.po" \
            "$RUNNER_TEMP/cloudflare-ip.zh-cn.lmo"
          test -s "$RUNNER_TEMP/cloudflare-ip.zh-cn.lmo"
          echo "CFIP_UI_LMO=$RUNNER_TEMP/cloudflare-ip.zh-cn.lmo" >> "$GITHUB_ENV"
      - name: Provision the current working tree into real LuCI
        run: CFIP_UI_LANG='${{ inputs.language || 'en' }}' bash tests/real-luci-ui-provision.sh cfip-ui-gate 18080
      - name: Install Playwright bindings and use runner Chrome
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-noto-cjk
          fc-list :lang=zh family | grep -qi 'Noto Sans CJK'
          npm install --prefix "$RUNNER_TEMP/ui" --no-audit --no-fund playwright@1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo 'No Chrome executable on runner; browser setup required' >&2
            exit 1
          fi
          echo "PLAYWRIGHT_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Run real LuCI interaction assertions
        run: |
          set -euo pipefail
          language='${{ inputs.language || 'en' }}'
          CFIP_UI_LANG="$language" \
          NODE_PATH="$RUNNER_TEMP/ui/node_modules" \
            node tests/real-luci-ui.cjs \
            --evidence "$GITHUB_WORKSPACE/real-luci-ui-evidence"
      - name: Install checksum-pinned Aurora theme in OpenWrt
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/luci-theme-aurora.ipk" \
            https://github.com/eamonxg/luci-theme-aurora/releases/download/v1.4.0/luci-theme-aurora_1.4.0-r20260920_all.ipk
          echo "5b3f2d669ef82e575498d1b99c4b9b498088540eeff7db989f214b63d3ef8a8e  $RUNNER_TEMP/luci-theme-aurora.ipk" | sha256sum -c -
          docker cp "$RUNNER_TEMP/luci-theme-aurora.ipk" cfip-ui-gate:/tmp/luci-theme-aurora.ipk
          docker exec cfip-ui-gate opkg install /tmp/luci-theme-aurora.ipk
      - name: Capture all-page real theme and viewport visual matrix
        run: |
          set -euo pipefail
          language='${{ inputs.language || 'en' }}'
          docker exec cfip-ui-gate sh -c "uci set luci.main.lang='$language'; uci commit luci; rm -rf /tmp/luci-indexcache /tmp/luci-modulecache"
          NODE_PATH="$RUNNER_TEMP/ui/node_modules" \
            CFIP_VISUAL_OUT="$GITHUB_WORKSPACE/real-luci-ui-evidence/visual/$language" \
            CFIP_UI_LANG="$language" \
            node tests/real-luci-ui-visual.cjs
      - name: Provision disposable proxy-service route fixtures
        run: |
          set -euo pipefail
          docker exec cfip-ui-gate sh -c '
            for service in passwall openclash; do
              cat > "/etc/init.d/$service" <<"EOF"
          #!/bin/sh
          [ "${1:-}" = running ] && exit 1
          exit 0
          EOF
              chmod 755 "/etc/init.d/$service"
            done
            rm -rf /tmp/luci-indexcache* /tmp/luci-modulecache*
            /etc/init.d/rpcd reload
            /etc/init.d/uhttpd restart >/dev/null 2>&1
          '
          sleep 2
      - name: Capture installed proxy integration forms on every theme and breakpoint
        run: |
          set -euo pipefail
          language='${{ inputs.language || 'en' }}'
          NODE_PATH="$RUNNER_TEMP/ui/node_modules" \
            CFIP_UI_LANG="$language" \
            CFIP_VISUAL_PAGES='openclash,passwall' \
            CFIP_VISUAL_SCENARIO='disposable-init-script-fixtures-installed-route-forms-only' \
            CFIP_VISUAL_OUT="$GITHUB_WORKSPACE/real-luci-ui-evidence/visual/${language}-proxy-installed" \
            node tests/real-luci-ui-visual.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: real-luci-ui-evidence-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: real-luci-ui-evidence/
          if-no-files-found: warn
      - name: Remove the disposable container
        if: always()
        run: docker rm -f cfip-ui-gate || true
