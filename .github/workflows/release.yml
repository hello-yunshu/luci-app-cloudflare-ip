name: Build and Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: release-qualification
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  REPO_NAME: luci-app-cloudflare-ip

jobs:
  changes:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.scope.outputs.release_needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: scope
        name: Classify release scope
        shell: bash
        env:
          QUALIFICATION_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          changed=$(git diff-tree --no-commit-id --name-only -r "$QUALIFICATION_SHA^" "$QUALIFICATION_SHA")
          release_needed=false
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              docs/*|plans/*|README|README.*|LICENSE|.gitignore) ;;
              *) release_needed=true; break ;;
            esac
          done <<< "$changed"
          echo "release_needed=$release_needed" >> "$GITHUB_OUTPUT"
          if [[ "$release_needed" == false ]]; then
            echo 'docs/plans-only change: release promotion is a clean no-op'
          fi

  check-qualification:
    needs: changes
    if: needs.changes.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      run_id: ${{ steps.verify.outputs.run_id }}
      version: ${{ steps.verify.outputs.version }}
      release: ${{ steps.verify.outputs.release }}
      channel: ${{ steps.verify.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - id: verify
        name: Verify exact SHA qualification manifest
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ github.event.workflow_run.id }}
          QUALIFICATION_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification"
          gh run download "$QUALIFICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name qualification-evidence --dir "$RUNNER_TEMP/qualification"
          manifest="$RUNNER_TEMP/qualification/qualification.json"
          test -f "$manifest"
          python3 scripts/validate-qualification-evidence.py "$manifest" --commit "$QUALIFICATION_SHA" --require-assets 4
          version=$(sed -n 's/^PKG_VERSION:=//p' package/luci-app-cloudflare-ip/Makefile | head -n1)
          release=$(sed -n 's/^PKG_RELEASE:=//p' package/luci-app-cloudflare-ip/Makefile | head -n1)
          channel=$(jq -er 'select(.schemaVersion == 1) | .channel' release-channel.json)
          reason=$(jq -er 'select((.reason // "") != "") | .reason' release-channel.json)
          if [[ "$channel" != prerelease ]]; then
            echo "stable channel requires an explicit Stable Gate; automatic promotion is disabled" >&2
            exit 1
          fi
          echo "release channel: $channel ($reason)"
          [[ "$version" != *-dev ]]
          {
            echo "commit=$QUALIFICATION_SHA"
            echo "run_id=$QUALIFICATION_RUN_ID"
            echo "version=$version"
            echo "release=$release"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

  collect:
    needs: check-qualification
    if: needs.check-qualification.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-qualification.outputs.commit }}
          fetch-depth: 1
      - name: Collect exact qualification artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ needs.check-qualification.outputs.run_id }}
          VERSION: ${{ needs.check-qualification.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/qualification-assets"
          mkdir -p "$work" release
          for artifact in \
            luci-app-cloudflare-ip-ipk-v24.10.5 \
            luci-app-cloudflare-ip-apk-v25.12.0 \
            qualification-evidence; do
            gh run download "$QUALIFICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$work/$artifact"
          done
          find "$work" -type f \( -name 'luci-app-cloudflare-ip*.ipk' -o -name 'luci-app-cloudflare-ip*.apk' \) -exec cp {} release/ \;
          find "$work" -type f -name qualification.json -exec cp {} release/ \;
          test "$(find release -type f -name '*.ipk' | wc -l | tr -d ' ')" -eq 2
          test "$(find release -type f -name '*.apk' | wc -l | tr -d ' ')" -eq 2
          test -f release/qualification.json
      - name: Generate relative checksums and verify asset contract
        env:
          VERSION: ${{ needs.check-qualification.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum luci-app-cloudflare-ip*.ipk luci-app-cloudflare-ip*.apk > sha256sums.txt)
          bash tests/release-asset-contract.sh release "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error

  release:
    needs: [check-qualification, collect]
    if: needs.check-qualification.result == 'success' && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-qualification.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release/
      - name: Guard immutable release tag before asset upload
        env:
          EXPECTED_SHA: ${{ needs.check-qualification.outputs.commit }}
          VERSION: ${{ needs.check-qualification.outputs.version }}
          RELEASE: ${{ needs.check-qualification.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          tag="v${VERSION}-${RELEASE}"
          ref="refs/tags/${tag}"
          if git show-ref --verify --quiet "$ref"; then
            tag_sha="$(git rev-parse "${ref}^{commit}")"
            test "$tag_sha" = "$EXPECTED_SHA" || { echo "immutable tag collision: $tag points to $tag_sha, expected $EXPECTED_SHA" >&2; exit 1; }
          fi
      - name: Publish exact qualified release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-qualification.outputs.version }}-${{ needs.check-qualification.outputs.release }}
          name: v${{ needs.check-qualification.outputs.version }}-${{ needs.check-qualification.outputs.release }}
          prerelease: true
          make_latest: false
          body: |
            Cloudflare IP Optimization v${{ needs.check-qualification.outputs.version }}-${{ needs.check-qualification.outputs.release }}

            This release is promoted only from the exact SHA and successful automated qualification run recorded in `qualification.json`.

            Assets include the Cloudflare IP OpenWrt IPK/APK packages and relative SHA256 checksums. Generic Rill source/runtime contracts are owned by `hello-yunshu/rill-ml`; OpenWrt package distribution is owned by `hello-yunshu/rill-openwrt-packages`, and Cloudflare consumes it through OpenWrt package management.

            Real OpenWrt device runtime, hardware coverage, PassWall/OpenClash version matrix, and 24-hour soak remain separate evidence boundaries unless explicitly recorded in the qualification manifest.
            This 2.x release is part of the 2.0 prerelease development line and is not a stable/latest release.
          files: |
            release/*.ipk
            release/*.apk
            release/sha256sums.txt
            release/qualification.json
      - name: Verify published tag identity
        env:
          EXPECTED_SHA: ${{ needs.check-qualification.outputs.commit }}
          VERSION: ${{ needs.check-qualification.outputs.version }}
          RELEASE: ${{ needs.check-qualification.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse "refs/tags/v${VERSION}-${RELEASE}^{commit}")" = "$EXPECTED_SHA"
