          bash tests/v2-observation.sh
          bash tests/v2-rill-shadow.sh
          bash tests/v2-source-engine.sh
          bash tests/source-size-cap.sh
          bash tests/v2-single-cfst.sh
          bash tests/v2-lan-publisher.sh
          bash tests/v2-status.sh
          bash tests/v2-transaction.sh
          bash tests/v2-candidate-budget.sh
          bash tests/v2-cfst-exact-input.sh
          bash tests/v2-measurement-deadline.sh
          bash tests/service-running-timeout.sh
          bash tests/status-running-timeout.sh
          bash tests/monotonic-deadline.sh
          bash tests/external-operation-timeout-tree.sh
          bash tests/watchdog-timer-cleanup.sh
          bash tests/cron-semantic-validation.sh
          bash tests/rill-feedback-negative.sh
          bash tests/rill-state-and-delayed.sh
          bash tests/rill-health-contract.sh
          bash tests/rill-guarded-assisted.sh
          bash tests/rill-assisted-authority-fallback.sh
          bash tests/rill-assisted-resource-pressure-selection.sh
          bash tests/rill-outcome-attribution.sh
          bash tests/rill-reward-v2.sh
          bash tests/rill-qualification-rolling.sh
          bash tests/probe-batching.sh
          bash tests/source-policy.sh
          bash tests/rill-single-learner-contract.sh
          bash tests/cfst-version-contract.sh
          bash tests/source-refresh-deadline.sh
          bash tests/resource-pressure-contract.sh
          bash tests/multi-ip-diversity-contract.sh
          bash tests/reuse-policy-contract.sh
          bash tests/reuse-runtime-independence.sh
