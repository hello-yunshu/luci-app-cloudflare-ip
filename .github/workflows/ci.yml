  docker-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build bounded Docker replay harness image
        run: docker compose -f docker/2.3/compose.yaml build adaptive-replay
      - name: Run bounded Docker replay harness
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace/repo" -w /workspace/repo cloudflare-ip-adaptive-replay:ci docker/2.3/run-experiments.sh
      - name: Validate replay evidence schema
        run: |
          set -euo pipefail
          jq -e '(.schemaVersion == 1) and (.timingMode == "replayed") and (.environment == "macbook-docker-replay") and ((.scenarios | length) == 7) and all(.scenarios[]; (has("estimatedWallClockSaving") | not))' docker/2.3/results/replay-evidence.json
          jq -e '(.schemaVersion == 1) and (.source.timingMode == "replayed") and (.aggregate | has("meanReplayProbeReductionRatio") and has("meanReplayWinnerRecall") and has("meanReplayTopNRecall") and has("replayFallbackRate") and has("meanReplayMeasurementDurationMs"))' docker/2.3/results/replay-evidence-summary.json

  legacy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Run 1.8.3 preservation contracts
        run: |
          set -euo pipefail
          bash tests/openclash-xhttp-filter.sh
          bash tests/openclash-protocol-matrix.sh
          bash tests/regex-ip-suffix.sh
          bash tests/passwall-managed.sh
          bash tests/security-contract.sh
          for test in tests/legacy/*.sh; do
            case "$test" in *_helpers.sh) continue;; esac
            bash "$test"
          done

  openwrt-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: v24.10.5
            pkgtype: ipk
            arch: x86_64
            rust_target: x86_64-unknown-linux-musl
          - branch: v25.12.0
            pkgtype: apk
            arch: x86_64
            rust_target: x86_64-unknown-linux-musl
          - branch: v24.10.8
            pkgtype: ipk
            arch: x86_64
            rust_target: x86_64-unknown-linux-musl
          - branch: v25.12.5
            pkgtype: apk
            arch: x86_64
            rust_target: x86_64-unknown-linux-musl
    container:
      image: ghcr.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.branch }}
      options: --user root
    steps:
      - uses: actions/checkout@v7
        with:
          path: luci-app-cloudflare-ip
      - name: Checkout canonical Runtime package at immutable contract commit
        shell: bash
        run: |
          set -euo pipefail
          package_commit=$(python3 -c 'import json; print(json.load(open("luci-app-cloudflare-ip/contracts/rill-runtime.json"))["openwrtPackage"]["commit"])')
          [[ "$package_commit" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none https://github.com/hello-yunshu/rill-openwrt-packages.git rill-openwrt-packages
          git -C rill-openwrt-packages fetch --depth=1 origin "$package_commit"
          git -C rill-openwrt-packages checkout --detach "$package_commit"
          test "$(git -C rill-openwrt-packages rev-parse HEAD)" = "$package_commit"
      - name: Cache OpenWrt Rust toolchain and Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            /builder/dl/cargo
            /builder/rustup
            /builder/cargo
          key: cloudflare-openwrt-rust-${{ runner.os }}-${{ matrix.branch }}-${{ hashFiles('rill-openwrt-packages/package/rill-runtime/Makefile', 'rill-openwrt-packages/package/rill-runtime-preview/Makefile', 'rill-openwrt-packages/scripts/prepare_rust_toolchain.sh') }}
          restore-keys: |
            cloudflare-openwrt-rust-${{ runner.os }}-${{ matrix.branch }}-
      - name: Prepare SDK
        shell: bash
        run: |
          set -euo pipefail
          cd /builder
          mkdir -p /builder/shared-workdir
          rm -rf /builder/shared-workdir/build
          ln -sf /builder /builder/shared-workdir/build
          ./scripts/feeds update base packages luci
          ./scripts/feeds install luci-base bash curl tar jq ca-bundle ca-certificates uhttpd rust
          for rust_makefile in feeds/packages/lang/rust/Makefile feeds/packages/lang/rust/rust-host-build.mk; do
            if [ -f "$rust_makefile" ]; then
              sed -i 's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/g' "$rust_makefile"
            fi
          done
          if grep -R -n -- '--set=llvm.download-ci-llvm=true' feeds/packages/lang/rust; then
            echo 'OpenWrt Rust feed still enables CI LLVM downloads' >&2
            exit 1
          fi
          rill_workspace="$GITHUB_WORKSPACE/rill-openwrt-packages"
          (
            cd "$rill_workspace"
            GITHUB_WORKSPACE="$rill_workspace" RUST_STAGING_DIR=/builder/staging_dir/host \
              ./scripts/prepare_rust_toolchain.sh
          )
          cp -r "$GITHUB_WORKSPACE/luci-app-cloudflare-ip/package/luci-app-cloudflare-ip" ./package/
          cp -r "$GITHUB_WORKSPACE/rill-openwrt-packages/package/rill-runtime" ./package/
          cp -r "$GITHUB_WORKSPACE/rill-openwrt-packages/package/rill-runtime-preview" ./package/
          {
            echo 'CONFIG_PACKAGE_rill-runtime=y'
            echo 'CONFIG_PACKAGE_rill-runtime-preview=y'
            echo 'CONFIG_PACKAGE_luci-app-cloudflare-ip=y'
            echo 'CONFIG_PACKAGE_luci-app-cloudflare-ip-rill=y'
          } >> .config
          make defconfig
      - name: Build package
        shell: bash
        working-directory: /builder
        run: |
          set -euo pipefail
          unset CI
          build_helper="$GITHUB_WORKSPACE/luci-app-cloudflare-ip/scripts/openwrt-build-diagnostic.sh"
          bash "$build_helper" package/rill-runtime/compile
          bash "$build_helper" package/rill-runtime-preview/compile
          if [ "${{ matrix.pkgtype }}" = apk ]; then
            # APK rejects the source development suffix. Patch only the
            # checked-out package Makefile so dependency PKG_VERSION values
            # remain untouched and the source contract stays exact.
            sed -i 's/^PKG_VERSION:=\([0-9][0-9.]*\)-dev$/PKG_VERSION:=\1.1/' package/luci-app-cloudflare-ip/Makefile
            bash "$build_helper" package/luci-app-cloudflare-ip/compile
          else
            bash "$build_helper" package/luci-app-cloudflare-ip/compile
          fi
      - name: Inspect package artifact
        shell: bash
        working-directory: /builder
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          base_file=$(find ./bin -type f -name "luci-app-cloudflare-ip*.${{ matrix.pkgtype }}" ! -name '*-rill*' | head -n1)
          rill_file=$(find ./bin -type f -name "luci-app-cloudflare-ip-rill*.${{ matrix.pkgtype }}" | head -n1)
          preview_file=$(find ./bin -type f -name "rill-runtime-preview*.${{ matrix.pkgtype }}" | head -n1)
          test -n "$base_file"; test -n "$rill_file"; test -n "$preview_file"
          for file in "$base_file" "$rill_file" "$preview_file"; do
            cp "$file" "$GITHUB_WORKSPACE/output/"
            mode=base; [[ "${file##*/}" == *-rill* ]] && mode=rill; [[ "${file##*/}" == rill-runtime-preview* ]] && mode=preview
            case "${file##*.}" in
              ipk) tar -tf "$file" >/dev/null
                   bash "$GITHUB_WORKSPACE/luci-app-cloudflare-ip/tests/package-content-contract.sh" "$file" ipk "$mode" ;;
              apk) test -x /builder/staging_dir/host/bin/apk
                   /builder/staging_dir/host/bin/apk --allow-untrusted adbdump "$file" >/dev/null
                   APK=/builder/staging_dir/host/bin/apk bash "$GITHUB_WORKSPACE/luci-app-cloudflare-ip/tests/package-content-contract.sh" "$file" apk "$mode" ;;
            esac
          done
          (
            cd "$GITHUB_WORKSPACE/output"
            sha256sum -- "${base_file##*/}" "${rill_file##*/}" "${preview_file##*/}"
          ) > "$GITHUB_WORKSPACE/output/SHA256SUMS"
      - uses: actions/upload-artifact@v7
        with:
          name: luci-app-cloudflare-ip-${{ matrix.pkgtype }}-${{ matrix.branch }}
          path: output/
          if-no-files-found: error

  rill-runtime-integration:
    name: Same-release generic Runtime integration
    needs: openwrt-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout canonical Runtime package at immutable contract commit
        shell: bash
        run: |
          set -euo pipefail
          package_commit=$(python3 -c 'import json; print(json.load(open("contracts/rill-runtime.json"))["openwrtPackage"]["commit"])')
          [[ "$package_commit" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none https://github.com/hello-yunshu/rill-openwrt-packages.git rill-openwrt-packages
          git -C rill-openwrt-packages fetch --depth=1 origin "$package_commit"
          git -C rill-openwrt-packages checkout --detach "$package_commit"
          test "$(git -C rill-openwrt-packages rev-parse HEAD)" = "$package_commit"
      - name: Require exact Preview package qualification evidence
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_commit=$(git -C rill-openwrt-packages rev-parse HEAD)
          qualification_run=$(jq -r '.qualification.runId' contracts/rill-runtime.json)
          run_json=$(gh run view "$qualification_run" --repo hello-yunshu/rill-openwrt-packages --json headSha,status,conclusion)
          test "$(jq -r .headSha <<<"$run_json")" = "$package_commit"
          test "$(jq -r .status <<<"$run_json")" = completed
          test "$(jq -r .conclusion <<<"$run_json")" = success
          evidence_dir="$RUNNER_TEMP/package-qualification"
          mkdir -p "$evidence_dir"
          gh run download "$qualification_run" --repo hello-yunshu/rill-openwrt-packages --name "qualification-evidence-$qualification_run" --dir "$evidence_dir"
          evidence=$(find "$evidence_dir" -type f -name qualification.json -print -quit)
          test -n "$evidence"
          jq -e --arg commit "$package_commit" --arg upstream "$(jq -r '.preview.commit' contracts/rill-runtime.json)" \
            '.packageCommit==$commit and .releaseEligible==true and .previewPackage.name=="rill-runtime-preview" and .previewPackage.upstreamCommit==$upstream and .previewPackage.qualificationState=="PASS"' "$evidence"
          echo "qualification_manifest_sha256=$(sha256sum "$evidence" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          python3 scripts/check_rill_dependency.py --package-dir rill-openwrt-packages
      - uses: actions/download-artifact@v8
        with:
          name: luci-app-cloudflare-ip-ipk-v24.10.8
          path: runtime-package
      - name: Extract and verify the actual Preview package Runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          package_commit=$(git -C rill-openwrt-packages rev-parse HEAD)
          preview_package=$(find runtime-package -type f -name 'rill-runtime-preview*.ipk' -print -quit)
          test -n "$preview_package"
          mkdir -p "$RUNNER_TEMP/preview-ipk/control" "$RUNNER_TEMP/preview-ipk/data"
          data_member=$(tar -tf "$preview_package" | sed 's#^\./##' | grep '^data\.tar' | head -n1)
          tar -xf "$preview_package" -C "$RUNNER_TEMP/preview-ipk" "./$data_member"
          case "$data_member" in *.zst) tar --zstd -xf "$RUNNER_TEMP/preview-ipk/$data_member" -C "$RUNNER_TEMP/preview-ipk/data" ;; *.gz) tar -xzf "$RUNNER_TEMP/preview-ipk/$data_member" -C "$RUNNER_TEMP/preview-ipk/data" ;; *) tar -xf "$RUNNER_TEMP/preview-ipk/$data_member" -C "$RUNNER_TEMP/preview-ipk/data" ;; esac
          test -x "$RUNNER_TEMP/preview-ipk/data/usr/bin/rill-runtime"
          upstream_commit=$(jq -r '.preview.commit' contracts/rill-runtime.json)
          test "$(jq -r '.upstream.commit' rill-openwrt-packages/metadata/rill-runtime-preview.json)" = "$upstream_commit"
          version=$(jq -r '.openwrtPackage.packageVersion' contracts/rill-runtime.json)
          {
            echo "version=$version"
            echo "package_commit=$package_commit"
            echo "stable_commit=$(jq -r '.resolved.upstreamCommit' contracts/rill-runtime.json)"
            echo "qualification_run=$(jq -r '.qualification.runId' contracts/rill-runtime.json)"
            echo "qualification_manifest_sha256=${{ steps.qualification.outputs.qualification_manifest_sha256 }}"
            echo "upstream_tag=preview-exact-commit"
            echo "commit=$upstream_commit"
            echo "source_archive_sha256=not-applicable-preview"
            echo "binary_sha256=$(sha256sum "$RUNNER_TEMP/preview-ipk/data/usr/bin/rill-runtime" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
      - name: Install musl loader for the actual OpenWrt Preview binary
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl
          test -x /lib/ld-musl-x86_64.so.1
          mkdir -p "$RUNNER_TEMP/musl-libs"
          docker run --rm --platform linux/amd64 \
            -v "$RUNNER_TEMP/musl-libs:/out" alpine:3.20 \
            sh -c 'apk add --no-cache libgcc >/dev/null && cp /usr/lib/libgcc_s.so.1 /out/libgcc_s.so.1'
          test -s "$RUNNER_TEMP/musl-libs/libgcc_s.so.1"
      - name: Execute the real Cloudflare feedback integration
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/musl-libs:/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu
        run: |
          bash tests/rill-feedback-integration.sh "$RUNNER_TEMP/preview-ipk/data/usr/bin/rill-runtime"
          bash tests/rill-feedback-negative.sh
          bash tests/rill-real-runtime-full-lifecycle.sh "$RUNNER_TEMP/preview-ipk/data/usr/bin/rill-runtime"
      - name: Record same-release evidence
        shell: bash
        env:
          VERSION: ${{ steps.runtime.outputs.version }}
          PACKAGE_COMMIT: ${{ steps.runtime.outputs.package_commit }}
          QUALIFICATION_RUN: ${{ steps.runtime.outputs.qualification_run }}
          QUALIFICATION_MANIFEST_SHA256: ${{ steps.runtime.outputs.qualification_manifest_sha256 }}
          STABLE_COMMIT: ${{ steps.runtime.outputs.stable_commit }}
          PREVIEW_COMMIT: ${{ steps.runtime.outputs.commit }}
          UPSTREAM_TAG: ${{ steps.runtime.outputs.upstream_tag }}
          SOURCE_ARCHIVE_SHA256: ${{ steps.runtime.outputs.source_archive_sha256 }}
          BINARY_SHA256: ${{ steps.runtime.outputs.binary_sha256 }}
        run: |
          set -euo pipefail
          jq -n --arg version "$VERSION" --arg packageCommit "$PACKAGE_COMMIT" --arg qualificationRun "$QUALIFICATION_RUN" --arg qualificationManifestSha256 "$QUALIFICATION_MANIFEST_SHA256" --arg upstreamTag "$UPSTREAM_TAG" --arg stableCommit "$STABLE_COMMIT" --arg previewCommit "$PREVIEW_COMMIT" --arg sourceArchiveSha256 "$SOURCE_ARCHIVE_SHA256" --arg binarySha256 "$BINARY_SHA256" \
            '{schemaVersion:1,consumer:"hello-yunshu/luci-app-cloudflare-ip",package:{repository:"hello-yunshu/rill-openwrt-packages",commit:$packageCommit,qualificationRunId:($qualificationRun|tonumber),qualificationManifestSha256:$qualificationManifestSha256},stablePackageQualification:"PASS",previewRuntimeIntegration:"PASS",stableCommit:$stableCommit,previewCommit:$previewCommit,runtime:{version:$version,tag:$upstreamTag,commit:$previewCommit,sourceArchiveSha256:$sourceArchiveSha256,binarySha256:$binarySha256},integration:{test:"tests/rill-feedback-integration.sh",status:"pass",sameRelease:true,sourcePackage:"rill-runtime-preview",packageBinary:"/usr/bin/rill-runtime"}}' \
            > rill-runtime-integration.json
      - uses: actions/upload-artifact@v7
        with:
          name: rill-runtime-integration-evidence
          path: rill-runtime-integration.json
          if-no-files-found: error

  package-release-guard:
    runs-on: ubuntu-latest
    needs: [host-contract, openwrt-package, rill-runtime-integration, docker-replay]
    steps:
      - uses: actions/checkout@v7
      - name: Verify development release guard
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^PKG_VERSION:=//p' package/luci-app-cloudflare-ip/Makefile | head -n1)
          if [[ "$GITHUB_REF" == refs/heads/main ||
            "$GITHUB_REF" == refs/heads/release/* ||
            ( "$GITHUB_EVENT_NAME" == pull_request && "$GITHUB_BASE_REF" == main ) ]]; then
            [[ "$version" != *-dev ]]
          else
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev$ ]]
          fi

  rpc-luci-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install contract tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: RPC and LuCI dispatch contracts
        run: |
          set -euo pipefail
          bash tests/legacy/rpc-roundtrip.sh
          bash tests/legacy/luci-static-contract.sh
          jq empty package/luci-app-cloudflare-ip/root/usr/share/luci/menu.d/luci-app-cloudflare-ip.json
          jq empty package/luci-app-cloudflare-ip/root/usr/share/rpcd/acl.d/luci-app-cloudflare-ip.json

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest "$RUNNER_TEMP/bin"
      - name: Lint workflows
        run: "${{ runner.temp }}/bin/actionlint"

  real-cfst-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Download and execute real CFST
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cfst"
          release_json="$RUNNER_TEMP/cfst/release.json"
          curl -fsSL --retry 3 https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest -o "$release_json"
          asset_url=$(jq -r '.assets[] | select(.name|test("linux_amd64.*tar.gz$"; "i")) | .browser_download_url' "$release_json" | head -n1)
          test -n "$asset_url"
          curl -fsSL --retry 3 "$asset_url" -o "$RUNNER_TEMP/cfst/archive"
          tar -xf "$RUNNER_TEMP/cfst/archive" -C "$RUNNER_TEMP/cfst"
          cfst=$(find "$RUNNER_TEMP/cfst" -type f -name cfst | head -n1)
          test -n "$cfst"
          chmod +x "$cfst"
          cat > "$RUNNER_TEMP/cfst/input.txt" <<'EOF_INPUT'
          104.16.1.1/32
          2606:4700::1111/128
          EOF_INPUT
          bash tests/cfst-real-smoke.sh "$cfst" "$RUNNER_TEMP/cfst/input.txt"

  release-asset-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify complete release asset/checksum contract
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/release-contract"
          mkdir -p "$tmp"
          version=$(sed -n 's/^PKG_VERSION:=//p' package/luci-app-cloudflare-ip/Makefile | head -n1)
          touch "$tmp/luci-app-cloudflare-ip_${version}-1.ipk" "$tmp/luci-app-cloudflare-ip-rill_${version}-1.ipk" "$tmp/luci-app-cloudflare-ip_${version}-1.apk" "$tmp/luci-app-cloudflare-ip-rill_${version}-1.apk"
          (cd "$tmp" && sha256sum luci-app-cloudflare-ip* > sha256sums.txt)
          bash tests/release-asset-contract.sh "$tmp" "$version"

  qualification-guard:
    if: always()
    needs: [host-contract, legacy-contract, rpc-luci-contract, openwrt-package, rill-runtime-integration, package-release-guard, workflow-lint, real-cfst-smoke, release-asset-contract, docker-replay]
    runs-on: ubuntu-latest
    steps:
      - name: Require every qualification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")'
          echo QUALIFICATION_COMPLETE

  evidence-manifest:
    if: always()
    needs: [host-contract, legacy-contract, rpc-luci-contract, openwrt-package, rill-runtime-integration, package-release-guard, workflow-lint, real-cfst-smoke, release-asset-contract, docker-replay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate exact qualification manifest
        env:
          RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACTS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '[.artifacts[] | {name: .name, digest: (.digest // null), size: .size_in_bytes}]' | jq -s 'add')"
          asset_dir="$RUNNER_TEMP/qualification-assets"
          mkdir -p "$asset_dir"
          for artifact in luci-app-cloudflare-ip-ipk-v24.10.5 luci-app-cloudflare-ip-apk-v25.12.0; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$asset_dir/$artifact"
          done
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rill-runtime-integration-evidence --dir "$asset_dir/rill-runtime-integration"
          asset_files='[]'
          while IFS= read -r -d '' file; do
            hash=$(sha256sum "$file" | awk '{print $1}')
            rel="${file#"$asset_dir"/}"
            asset_files=$(jq --arg path "$rel" --arg sha "$hash" '. + [{path:$path,sha256:$sha}]' <<<"$asset_files")
          done < <(find "$asset_dir" -type f \( -name '*.ipk' -o -name '*.apk' \) ! -name 'rill-runtime-preview*' -print0)
          test "$(jq 'length' <<<"$asset_files")" -eq 4
          rill_evidence_dir="$asset_dir/rill-runtime-integration"
          rill_evidence_file=$(find "$rill_evidence_dir" -type f -name 'rill-runtime-integration.json' -print -quit)
          test -n "$rill_evidence_file"
          ASSET_FILES="$asset_files"
          RILL_EVIDENCE="$(cat "$rill_evidence_file")"
          for json_input in RESULTS ARTIFACTS ASSET_FILES RILL_EVIDENCE; do
            if ! jq -e . <<<"${!json_input}" >/dev/null 2>&1; then
              echo "invalid manifest JSON input: $json_input" >&2
              printf '%s\n' "${!json_input}" >&2
              exit 1
            fi
          done
          RESULTS="$RESULTS" ARTIFACTS="$ARTIFACTS" ASSET_FILES="$ASSET_FILES" RILL_EVIDENCE="$RILL_EVIDENCE" bash tests/evidence-manifest.sh qualification.json
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-evidence
          path: qualification.json
          if-no-files-found: error
