name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep shellcheck
      - name: Shell syntax and lint
        shell: bash
        run: |
          set -euo pipefail
          find package -type f \( -name '*.sh' -o -path '*/usr/bin/cf-ip-auto' -o -path '*/usr/bin/cf-ip-auto-*' \) -exec bash -n {} +
          sh -n package/luci-app-cloudflare-ip/root/etc/init.d/cf_ip
          sh -n package/luci-app-cloudflare-ip/root/etc/init.d/cf_ip_publisher
          sh -n package/luci-app-cloudflare-ip/root/usr/libexec/rpcd/cf_ip
          shellcheck -x -S error package/luci-app-cloudflare-ip/root/usr/bin/cf-ip-auto-v2 \
            package/luci-app-cloudflare-ip/root/usr/libexec/cf-ip/*.sh \
            package/luci-app-cloudflare-ip/root/etc/init.d/cf_ip \
            package/luci-app-cloudflare-ip/root/usr/libexec/rpcd/cf_ip
      - name: JSON and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find package -type f -name '*.json' -exec jq empty {} +
          find package -type f -name '*.js' -exec node --check {} \;
          jq empty release-channel.json
      - name: Release channel and package identity contracts
        run: |
          set -euo pipefail
          bash tests/release-channel-contract.sh
          bash tests/v2-prerelease-workflow-contract.sh
          bash tests/immutable-tag-contract.sh
          bash tests/package-release-bump-contract.sh
